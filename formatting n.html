<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Formatting</title>
</head>
<body>
    
<h1>HTML Text Formatting
<br>
<b>Bolden the text</b>
<br>
<strong>indicate the text is important</strong>
<br>
<i>Italize the text</i>
<em>emphasize the text</em>
<br>
<u>Underline the text</u>
<br>
<mark>Highlight the text</mark>
<small>Display text in smaller text</small>
<br>
<del>Indicate that the text has been deleted or removed</del>
<br>
<ins>Indicate inserted or added text</ins>
<br>
<sub>Display text in subscripts</sub>
<br>
<br>

</body>
</html>
